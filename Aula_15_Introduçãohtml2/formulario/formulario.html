        background-color: var(--cor-fundo);

        color: hsl(from var(--cor-texto) h s l);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

<body>
    <div class="container">
        <h1> Formulário </h1>

        <div class="tabs">
            <button id="cadastro" class="tab active" onclick="showForm('cadastro')">Cadastro</button>
            <button id="login" class="tab" onclick="showForm('login')">Login</button>
        </div>
        
        <div class="cadastro" class="formulario active">
            <form action="#">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required><br>
                </div>  
                <div class="form-group"> 
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required><br>
                </div>
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br>
                </div>
                <div class="form-group">
                    <label for="confirmar-senha">Confirmar Senha:</label>
                    <input type="password" maxlength="20" minlength="6" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha" required ><br><br>
                </div>
                <div class="form-group">    
                    <label for="termos">
                        <input type="checkbox" id="termos" name="termos" required>
                        Aceito os termos e condições
                    </label><br><br>
                </div>
                <div class="form-group">
                    <label for="linguagens">Linguagens de Programação:</label><br>
                    <input type="checkbox" id="linguagens" name="linguagens" value="html">
                    <label for="linguagens">HTML</label><br>
                    <input type="checkbox" id="linguagens" name="linguagens" value="css">
                    <label for="linguagens">CSS</label><br>
                    <input type="checkbox" id="linguagens" name="linguagens" value="javascript">
                    <label for="linguagens">JavaScript</label><br>
                </div>

                <input type="reset" value="Limpar">
                <input type="submit" value="Enviar">
            </form>
        </div>

        <div class="login">
            <form action="#">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email" required><br>
                </div>
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha"><br>
                </div>
                <input type="submit" value="Enviar">
            </form>
        </div>
    </div>
</body>
